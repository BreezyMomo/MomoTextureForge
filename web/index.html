<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="ui.momoTextureForgeWorkspace">Momo Texture Forge · 节点组合工作台</title>
<style>
html,body{margin:0;background:#15171b;color:#ece8df}
#startup-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;box-sizing:border-box;padding:28px;background:radial-gradient(ellipse at 50% 38%,#28252b 0,transparent 55%),#15171b;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;transition:opacity .18s ease}
#startup-screen *{box-sizing:border-box}
#startup-screen.startup-leaving{opacity:0;pointer-events:none}
#startup-screen .startup-card{width:min(100%,360px);text-align:center}
#startup-screen .startup-symbol{display:block;width:76px;height:76px;margin:0 auto 25px;color:#dfae72;filter:drop-shadow(0 0 22px #dfae7220)}
#startup-screen .startup-brand{margin:0;color:#dfae72;font-size:11px;letter-spacing:.3em}
#startup-screen h1{margin:6px 0 28px;color:#ece8df;font-size:23px;font-weight:600;letter-spacing:.09em}
#startup-screen .startup-track{height:2px;overflow:hidden;border-radius:2px;background:#343943}
#startup-screen .startup-track:after{content:"";display:block;width:36%;height:100%;background:linear-gradient(90deg,transparent,#dfae72,transparent);animation:startup-sweep 1.5s ease-in-out infinite}
#startup-screen #startup-status{margin:18px 0 0;color:#bac0cb;font-size:13px}
#startup-screen .startup-caption{margin:38px 0 0;color:#717b8b;font-size:11px;letter-spacing:.12em}
#startup-screen[data-state="error"] .startup-track{display:none}
#startup-screen[data-state="error"] #startup-status{color:#e8b58f}
#startup-screen #startup-error{margin-top:18px;text-align:left;color:#939caa;font-size:12px}
#startup-screen #startup-error[hidden]{display:none}
#startup-screen details{margin:16px 0}
#startup-screen summary{cursor:pointer}
#startup-screen pre{max-height:180px;overflow:auto;padding:12px;border:1px solid #343943;border-radius:6px;background:#1d2026;color:#bac0cb;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace}
#startup-screen button{display:block;margin:20px auto 0;padding:8px 22px;border:1px solid #dfae72;border-radius:6px;background:#dfae72;color:#191b20;font:inherit;cursor:pointer}
#startup-screen button:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes startup-sweep{from{transform:translateX(-100%)}to{transform:translateX(380%)}}
@media(prefers-reduced-motion:reduce){#startup-screen{transition:none}#startup-screen .startup-track:after{animation:none;width:100%;opacity:.6}}
</style>
<link rel="stylesheet" href="style.css" />
</head><body>
<section id="startup-screen" aria-label="正在打开 Momo Texture Forge" data-i18n-aria-label="ui.openingMomoTextureForge" aria-busy="true">
<div class="startup-card">
<svg class="startup-symbol" viewBox="0 0 80 80" fill="none" aria-hidden="true"><rect x="9" y="9" width="62" height="62" rx="15" stroke="currentColor" stroke-opacity=".3"/><path d="M40 19 61 40 40 61 19 40Z" stroke="currentColor" stroke-width="1.5"/><path d="M40 29 51 40 40 51 29 40Z" fill="currentColor" fill-opacity=".18" stroke="currentColor"/><path d="M40 13v9m0 36v9M13 40h9m36 0h9" stroke="currentColor" stroke-linecap="round"/></svg>
<p class="startup-brand">MOMO</p><h1>TEXTURE FORGE</h1>
<div class="startup-track" aria-hidden="true"></div>
<p id="startup-status" role="status" aria-live="polite"><span data-i18n="ui.preparingCanvas">正在准备画布…</span></p>
<div id="startup-error" hidden><p><span data-i18n="ui.reloadThePageIfTheProblemPersistsExpandTheErrorDetails">请重新加载页面。如果问题持续，可展开错误信息反馈给我们。</span></p><details><summary><span data-i18n="ui.showErrorDetails">查看错误信息</span></summary><pre id="startup-error-detail"></pre></details><button id="startup-retry" type="button"><span data-i18n="ui.reload">重新加载</span></button></div>
<p class="startup-caption"><span data-i18n="ui.graphicsTexturesAnimatedEffects">图形 · 纹理 · 动态特效</span></p>
</div></section>
<noscript><style>#startup-screen{display:none}</style><p><span data-i18n="ui.enableJavaScriptInYourBrowserToOpenTheCanvas">请启用浏览器的 JavaScript 后重新打开画布。</span></p></noscript>
<div id="toast" hidden></div><script type="module" src="bootstrap.js"></script></body></html>
