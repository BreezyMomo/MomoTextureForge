<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momo Texture Forge · 组合示例</title>
<style>body{margin:28px;background:#15171c;color:#eee;font:16px system-ui}h1{font-size:24px}p{color:#a7adbb}button,a{color:#edbd79}button{background:#292d35;border:1px solid #535762;padding:10px 16px;border-radius:6px;cursor:pointer}#samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}article{padding:16px;border:1px solid #343945;border-radius:10px;background:#20232a}img{display:block;width:100%;max-height:300px;aspect-ratio:1;object-fit:contain;background-color:#111;background-image:conic-gradient(#222 25%,transparent 0 50%,#222 0 75%,transparent 0);background-size:16px 16px}h2{font-size:17px;margin:12px 0}article a{display:block;padding:10px 12px;background:#343139;border:1px solid #73604d;border-radius:6px;text-align:center;text-decoration:none}article p{font-size:14px;line-height:1.7;min-height:48px}article ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}article li{font-size:12px;padding:4px 8px;background:#303544;border-radius:4px;color:#b9d5ee}article a:hover{background:#47404a}#status{min-height:24px}select{margin-left:8px;padding:8px;background:#292d35;color:#eee;border:1px solid #535762;border-radius:5px}article[hidden]{display:none}body>label{display:inline-block;margin-left:20px}@media(min-width:1100px){#samples{grid-template-columns:repeat(3,minmax(260px,1fr))}}@media(max-width:600px){body{margin:16px}#samples{grid-template-columns:1fr}}</style></head>
<body><h1>节点组合示例</h1><p>特效可从刀光、爆闪、冲击波与溶解遮罩开始；UI 可选菱形格纹、交错菱砖、斜纹与点阵底纹，制作可平铺的界面背景。新增排列可体验边框灯带、轮廓光点、人字/编织、渐变、流场与接口管线，可用分类筛选。每个示例都能在画布中拆解、调整参数和播放动画，也能保存为自己的组合资源。</p><button id="generate">重新生成预览</button> <a href="./">返回编辑器</a><label>示例分类 <select id="sample-category" aria-label="示例分类"><option value="all">全部示例</option><option value="arrangement">新增排列</option><option value="vfx">特效制作</option><option value="ui">UI 底纹</option><option value="composition">组合练习</option></select></label><p id="status">等待生成</p><main id="samples"></main><script type="module" src="examples.js"></script></body></html>
